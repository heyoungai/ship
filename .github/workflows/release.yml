name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          output="ship-${GOOS}-${GOARCH}${ext}"
          go build -ldflags="-s -w -X github.com/heyoungai/ship/cmd.Version=${VERSION}" -o "dist/${output}" .
          echo "BINARY=${output}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: dist/${{ env.BINARY }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Prepare release notes
        id: notes
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          OUT="${RUNNER_TEMP}/release-notes.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" "$OUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "## ${GITHUB_REF_NAME}"
              echo
              echo "_No curated notes at \`${NOTES}\`; see commit history below._"
            } > "$OUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing ${NOTES}; falling back to GitHub-generated release notes"
          fi
          echo "body_path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}

  # Scoop / Homebrew packages live in external repos and self-sync from GitHub
  # Releases (schedule + optional immediate notify). See:
  #   https://github.com/star-plan/scoop
  #   https://github.com/star-plan/homebrew-tap
  notify-packaging:
    needs: release
    runs-on: ubuntu-latest
    # Optional: set PACKAGING_TOKEN (fine-grained PAT with contents:write +
    # actions:write on star-plan/scoop and star-plan/homebrew-tap) for
    # near-instant package updates. Without it, those repos sync on cron.
    steps:
      - name: Notify scoop + homebrew-tap (optional)
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PACKAGING_TOKEN not set; packaging repos will pick up this release on their next sync."
            exit 0
          fi
          payload='{"event_type":"app-release","client_payload":{"app":"ship","tag":"'"${GITHUB_REF_NAME}"'"}}'
          echo "Dispatching app-release to star-plan/scoop"
          gh api repos/star-plan/scoop/dispatches --input - <<<"$payload"
          echo "Dispatching app-release to star-plan/homebrew-tap"
          gh api repos/star-plan/homebrew-tap/dispatches --input - <<<"$payload"
